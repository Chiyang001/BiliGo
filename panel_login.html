<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>登录面板 · BiliGo</title>
    <script src="/auth-assets/panel_theme.js"></script>
    <link rel="stylesheet" href="/auth-assets/panel_auth.css">
    <script src="/auth-assets/panel_login.js" defer></script>
</head>
<body class="auth-page login-page">
    <div class="auth-backdrop" aria-hidden="true"><span class="ambient-orb ambient-orb-blue"></span><span class="ambient-orb ambient-orb-pearl"></span><span class="backdrop-grid"></span></div>
    <header class="login-header">
        <a class="product-brand" href="/login" aria-label="BiliGo 管理面板">
            <img class="product-avatar" src="/auth-assets/developer-avatar.png" width="46" height="46" alt="炽阳001 的 GitHub 头像">
            <span>BiliGo<small>多平台私信自动回复工具</small></span>
        </a>
        <div class="theme-switch" role="group" aria-label="外观模式">
            <button type="button" data-theme-choice="system" aria-label="跟随系统" aria-pressed="true" title="跟随系统"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8m-4-4v4"/></svg></button>
            <button type="button" data-theme-choice="light" aria-label="明亮模式" aria-pressed="false" title="明亮模式"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
            <button type="button" data-theme-choice="dark" aria-label="黑暗模式" aria-pressed="false" title="黑暗模式"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14a8.5 8.5 0 0 1-10-10 8.5 8.5 0 1 0 10 10Z"/></svg></button>
        </div>
    </header>

    <main class="auth-layout login-layout">
        <section class="auth-story login-story" aria-label="BiliGo 多平台消息工作台">
            <span class="story-decoration" aria-hidden="true"><i></i><i></i><i></i></span>
            <h2>每一条消息，<br>都值得<span class="headline-accent">被回应。</span></h2>

            <div class="orbit-scene" aria-hidden="true">
                <div class="scene-grid"></div>
                <div class="orbit-ring orbit-ring-outer"></div>
                <div class="orbit-ring orbit-ring-inner"></div>
                <div class="orbit-trail"><span></span></div>
                <div class="creator-core">
                    <img src="/auth-assets/developer-avatar.png" width="112" height="112" alt="">
                    <span class="creator-dot"></span>
                </div>
                <div class="platform-satellite satellite-bili"><img src="/auth-assets/bilibili.png" width="32" height="32" alt=""><span>B 站</span></div>
                <div class="platform-satellite satellite-douyin"><img src="/auth-assets/tik-tok.png" width="28" height="28" alt=""><span>抖音</span></div>
                <div class="platform-satellite satellite-xhs"><img src="/auth-assets/xiaohongshu-seeklogo.png" width="32" height="32" alt=""><span>小红书</span></div>
                <div class="message-satellite"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5h14v11H9l-4 3V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 9h6m-6 3h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="message-lines"><i></i><i></i></span><b></b></div>
                <span class="scene-spark spark-one"></span><span class="scene-spark spark-two"></span>
            </div>
            <div class="story-bottom" aria-hidden="true"><span class="story-line"></span><span class="story-star">✧</span></div>
        </section>

        <section class="auth-card login-card" aria-labelledby="login-heading">
            <div class="card-topline">
                <span class="access-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 10V7a5 5 0 0 1 10 0v3M6 10h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 14v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
            </div>
            <h1 id="login-heading">欢迎回来</h1>
            <p class="intro">登录你的 BiliGo 工作台</p>
            <form id="panel-login-form">
                <label for="panel-password">面板密码</label>
                <div class="password-field">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="8" cy="10" r="4" stroke="currentColor" stroke-width="1.6"/><path d="m11 13 8 8m-4-4 2-2m0 4 2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                    <input id="panel-password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="请输入面板密码" aria-describedby="auth-error" required>
                    <button id="toggle-password" class="visibility-toggle" type="button" aria-label="显示密码" aria-pressed="false" aria-controls="panel-password">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 3 18 18M10.5 6.1 12 6c6 0 9 6 9 6a18 18 0 0 1-3 3.5M6.2 7.2A18 18 0 0 0 3 12s3 6 9 6c1.6 0 3-.4 4.2-1M10.2 10.2a2.5 2.5 0 0 0 3.6 3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <div class="login-options">
                    <label class="remember"><input id="remember-login" type="checkbox" name="remember">记住登录 <span class="remember-period">30 天</span></label>
                    <button id="login-help" class="text-button" type="button" aria-expanded="false" aria-controls="login-help-text">忘记密码？</button>
                </div>
                <p id="login-help-text" class="login-help-text" hidden>初始密码可在启动终端查看；已忘记自定义密码时，请在本机终端重置。</p>
                <p id="auth-error" class="message" role="alert" aria-live="polite"></p>
                <button id="login-submit" type="submit"><span class="submit-label">登录面板</span><svg class="submit-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="submit-spinner" aria-hidden="true"></span></button>
            </form>
        </section>
    </main>

    <footer class="login-footer"><p>© 2026 BiliGo</p><nav aria-label="开发者链接"><a href="https://space.bilibili.com/404891612" target="_blank" rel="noopener noreferrer">Bilibili</a><span>·</span><a href="https://github.com/Chiyang001?tab=repositories" target="_blank" rel="noopener noreferrer">GitHub ↗</a></nav></footer>
</body>
</html>
